<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ツンデレ小悪魔メフィーの黙って強くなりなさいよっ！</title>
<meta name="description" content="小悪魔メフィーが、あんたの癖を読んで強化を押し付けてくる弾よけアクション。攻撃は自動、よけるだけ。スマホでもパソコンでも、ブラウザですぐ遊べる。">
<meta name="theme-color" content="#13151e">
<meta property="og:type" content="website">
<meta property="og:title" content="ツンデレ小悪魔メフィーの黙って強くなりなさいよっ！">
<meta property="og:description" content="小悪魔メフィーが、あんたの癖を読んで強化を押し付けてくる弾よけアクション。攻撃は自動、よけるだけ。スマホでもパソコンでも、ブラウザですぐ遊べる。">
<meta property="og:url" content="https://kome0824.github.io/damatsuyo/">
<meta property="og:image" content="https://kome0824.github.io/damatsuyo/ogp.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="art/sprites/gift.png">
<link rel="apple-touch-icon" href="art/sprites/gift.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="sr-only">ツンデレ小悪魔メフィーの黙って強くなりなさいよっ！</h1>
    <div class="head-btns">
      <button class="btn small" id="bTitle" type="button">タイトル</button>
      <button class="btn small" id="bPause" type="button" hidden>一時停止</button>
      <button class="btn small" id="bFull" type="button" hidden>全画面</button>
    </div>
  </header>
  <div class="hud" id="hud" aria-live="off">
    <div class="hud-left">
      <div class="hud-hearts" id="hHearts" aria-label="体力"></div>
      <div class="hud-veto"><span class="lab">突き返し</span><span class="gems" id="hVeto"></span><span class="gauge"><i id="hGauge"></i></span></div>
    </div>
    <div class="hud-mid">
      <div class="hud-timer" id="hTimer">--</div>
    </div>
    <div class="hud-right">
      <div class="hud-round" id="hRound"></div>
      <div class="hud-kills" id="hKills"></div>
    </div>
    <div class="hud-rival"><img id="hFace" class="rv" alt="" data-mood=""><div class="hud-say" id="hSay"></div></div>
    <div class="hud-bars">
      <div class="tbar"><i id="hTbar"></i></div>
    </div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="戦闘場"></canvas>
    <div class="overlay" id="ov"></div>
    <div class="overlay ask" id="ask" hidden></div>
  </div>
  <div class="msgline" id="hMsg" aria-live="polite"></div>
  <div class="side-acts" id="sideActs" hidden></div>
  <div class="owned" id="owned"><span class="lab">押し付けられた強化</span><span class="muted">まだなし</span></div>
  <div class="pad" id="pad">
    <div class="stick" id="stick"><i class="ar" data-a="0" style="--a:0">▲</i><i class="ar" data-a="45" style="--a:45">▲</i><i class="ar" data-a="90" style="--a:90">▲</i><i class="ar" data-a="135" style="--a:135">▲</i><i class="ar" data-a="180" style="--a:180">▲</i><i class="ar" data-a="225" style="--a:225">▲</i><i class="ar" data-a="270" style="--a:270">▲</i><i class="ar" data-a="315" style="--a:315">▲</i><div class="knob" id="knob"></div></div>
    <div class="pad-r"><button class="pbtn" id="bDodge" type="button">回避</button></div>
  </div>
  <details class="dev" id="dev" hidden>
    <summary>開発用</summary>
    <div class="devbody">
      <section class="dsec">
        <div class="row"><button class="btn small danger" id="dAllReset" type="button">開発用の設定をすべて初期値に戻す</button><span class="muted" id="dAllMsg"></span></div>
        <p class="muted" id="dChanges"></p>
      </section>
      <section class="dsec">
        <h3>難易度の調整案</h3>
        <p class="muted">企画書の番号。変更は次の挑戦から反映。</p>
        <div id="dAdj" class="adjs"></div>
        <div class="row">
          <button class="btn small" type="button" data-preset="none">試作の状態（全部なし）</button>
          <button class="btn small" type="button" data-preset="123">段階2（1〜3）</button>
          <button class="btn small" type="button" data-preset="123456">全部</button>
        </div>
      </section>
      <section class="dsec">
        <h3>よく変える数値</h3>
        <div class="drow"><label for="dLen">フェーズの秒数</label><input type="range" id="dLen" min="10" max="45" step="5"><output id="oLen" for="dLen"></output></div>
        <div class="drow"><label for="dHp">はじめの体力</label><input type="range" id="dHp" min="3" max="10" step="1"><output id="oHp" for="dHp"></output></div>
        <div class="drow"><label for="dMul">湧きの縮み方</label><input type="range" id="dMul" min="0.78" max="0.92" step="0.01"><output id="oMul" for="dMul"></output></div>
        <div class="drow"><label for="dGrow">体力の伸び</label><input type="range" id="dGrow" min="1" max="1.3" step="0.01"><output id="oGrow" for="dGrow"></output></div>
        <label class="chk"><input type="checkbox" id="dShort">序盤のフェーズを短くする（5・15・18秒、4フェーズ目から上の秒数）</label>
        <label class="chk"><input type="checkbox" id="dRead">メフィーがこちらの癖を読んで選ぶ（外すとランダム）</label>
        <details class="json">
          <summary>全部の数値（JSON）</summary>
          <textarea id="dJson" spellcheck="false" rows="14" aria-label="全部の数値"></textarea>
          <div class="row">
            <button class="btn small" type="button" id="dJsonApply">反映する</button>
            <button class="btn small danger" type="button" id="dJsonReset">初期値に戻す</button>
            <span class="muted" id="dJsonMsg"></span>
          </div>
        </details>
      </section>
      <section class="dsec">
        <h3>自動操作</h3>
        <div class="row">
          <label class="chk" for="dAuto">遊んでいる画面を</label>
          <select id="dAuto">
            <option value="off">自分で操作</option>
            <option value="wander">動き回るだけ</option>
            <option value="evade">敵と弾をよける</option>
          </select>
          <button class="btn small" type="button" id="dSkip">このフェーズを飛ばす</button>
        </div>
        <div class="row">
          <button class="btn small" type="button" id="dMephy">フェーズ50（メフィー戦）へ飛ぶ</button>
          <span>から始める</span>
          <button class="btn small" type="button" data-from="10">フェーズ10</button>
          <button class="btn small" type="button" data-from="20">エンドレス20</button>
          <button class="btn small" type="button" data-from="30">エンドレス30</button>
          <button class="btn small" type="button" data-from="40">エンドレス40</button>
          <label class="chk"><input type="checkbox" id="dInv">無敵（当たっても減らない）</label>
          <label>早送りの敵の強化 <select id="dFfwdPick"><option value="random">ランダム</option><option value="easy">損の小さいもの</option></select></label>
          <button class="btn small" type="button" id="dEnding">エンディングを見る</button>
          <button class="btn small" type="button" id="dEndDemo">エンディングの見本</button>
        </div>
        <div class="row">
          <span>まとめて試す</span>
          <select id="dSimN" aria-label="回数"><option>20</option><option selected>50</option><option>100</option></select>
          <span>回</span>
          <button class="btn small primary" type="button" id="dSim">今の設定で試す</button>
        </div>
        <div id="dSimOut" class="simout muted">「動き回るだけ」と「敵と弾をよける」を、画面なしで最後まで遊ばせて、倒れたフェーズを数えます。</div>
      </section>
      <section class="dsec">
        <h3>記録</h3>
        <div id="dLog">直前のフェーズの癖：まだ記録なし</div>
        <div class="row"><button class="btn small" id="dTierAll" type="button">本気度をすべて選べるようにする</button><button class="btn small danger" id="dReset" type="button">図鑑と記録を消す</button></div>
      </section>
    </div>
  </details>
</div>
<script>window.OS = { PUBLIC: true, PUB_URL: 'https://kome0824.github.io/damatsuyo/' };</script>
<script src="src/config.js"></script>
<script src="src/data.js"></script>
<script src="src/core.js"></script>
<script src="src/bot.js"></script>
<script src="src/sfx.js"></script>
<script src="src/art.js"></script>
<script src="src/render.js"></script>
<script src="src/share.js"></script>
<script src="src/ui.js"></script>
<script data-goatcounter="https://kome-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
